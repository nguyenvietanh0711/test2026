apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-release-demo
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/nguyenvietanh0711/test2026.git
    targetRevision: main
    path: nginx-demo

  destination:
    server: https://api.nnea55tc.prd.m.fke.fptcloud.com
    namespace: nginx-release-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true